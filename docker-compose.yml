version: "3.9"

services:

  ml-service:
    build: ./ml-service
    container_name: crop-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    # After running train.py, uncomment the line below and rebuild:
    # volumes:
    #   - ./ml-service/model.h5:/app/model.h5:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: crop-backend
    ports:
      - "5000:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ML_SERVICE_URL=http://ml-service:8000
      - PORT=5000
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # In Docker, API calls go through the nginx proxy at /api
        VITE_API_URL: /api
    container_name: crop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
